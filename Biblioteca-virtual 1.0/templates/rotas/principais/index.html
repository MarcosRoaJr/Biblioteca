{% extends "base.html" %}
{% block title %}Página Inicial{% endblock %}

{% block content %}

<head>
    <link rel="stylesheet" href="../../../static/css/rotas/login.css">
</head>
<div class="login-container d-flex-center d-collun">
    <img src="../../../static/img/logo/logo.png" alt="Logo" />
    <div class="d-flex-center">
        <form class="form-login d-flex-center d-collun" action="/" method="post" autocomplete="off">
            <h2>Cracha:</h2><br>
            <div class="input-box">
                <input id="usuario" name="usuario" type="text" placeholder=" " required />
                <label class="label" for="usuario" aria-hidden="true">
                    <span class="char" style="--i:0">N</span>
                    <span class="char" style="--i:1">u</span>
                    <span class="char" style="--i:2">m</span>
                    <span class="char" style="--i:3">e</span>
                    <span class="char" style="--i:4">r</span>
                    <span class="char" style="--i:5">o</span>
                    <span class="char" style="--i:6">-</span>
                    <span class="char" style="--i:7">C</span>
                    <span class="char" style="--i:8">r</span>
                    <span class="char" style="--i:9">a</span>
                    <span class="char" style="--i:10">c</span>
                    <span class="char" style="--i:11">h</span>
                    <span class="char" style="--i:12">a</span>
                </label>
            </div>

            <div class="input-box">
                <input id="senha" name="senha" type="password" placeholder=" " required />
                <label class="label" for="senha" aria-hidden="true">
                    <span class="char" style="--i:0">S</span>
                    <span class="char" style="--i:1">e</span>
                    <span class="char" style="--i:2">n</span>
                    <span class="char" style="--i:3">h</span>
                    <span class="char" style="--i:4">a</span>
                </label>
            </div>

            <button type="submit" class="botao" onclick="sumir()">Entrar</button>
            <button type="button" class="botao" id="btn-qr" style="margin-top:1rem;">Ler QR do
                crachá</button>

            <!-- Container do leitor (fica oculto até clicar no botão) -->
            <div id="qr-container" style="display:none; margin-top:1rem;">
                <div id="reader" style="width:320px; max-width:100%;"></div>
                <button type="button" class="botao" id="fechar-qr" style="margin-top:0.5rem;">Cancelar</button>
            </div>
        </form>

        <form class="form-login  d-flex-center d-collun" action="/" method="post" autocomplete="off">
            <h2>Usuario:</h2><br>
            <div class="input-box">
                <input id="usuario" name="usuario" type="text" placeholder=" " required />
                <label class="label" for="usuario" aria-hidden="true">
                    <span class="char" style="--i:0">U</span>
                    <span class="char" style="--i:1">s</span>
                    <span class="char" style="--i:2">u</span>
                    <span class="char" style="--i:3">a</span>
                    <span class="char" style="--i:4">r</span>
                    <span class="char" style="--i:5">i</span>
                    <span class="char" style="--i:6">o</span>
                </label>
            </div>
            <div class="input-box">
                <input id="senha" name="senha" type="password" placeholder=" " required />
                <label class="label" for="senha" aria-hidden="true">
                    <span class="char" style="--i:0">S</span>
                    <span class="char" style="--i:1">e</span>
                    <span class="char" style="--i:2">n</span>
                    <span class="char" style="--i:3">h</span>
                    <span class="char" style="--i:4">a</span>
                </label>
            </div>
            <button type="submit" class="botao" onclick="sumir()">Entrar</button>
    </div>
    </form>
    {% if erro %}
    <div class="msg-alerta" role="alert" id="item">
        {{ msg }}
    </div>
    {% endif %}
</div>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const alerta = document.getElementById('item');
        if (alerta) {
            setTimeout(() => alerta.classList.add('sumir'), 8000);
        }
    });
    <!-- Lib do leitor de QR no navegador -->
    function getLoginForm() {
        return document.querySelector('form[action="/"]');
    }

    let qrInstance = null;

    document.getElementById('btn-qr').addEventListener('click', async () => {
        const container = document.getElementById('qr-container');
        container.style.display = 'block';

        if (!qrInstance) {
            qrInstance = new Html5Qrcode("reader");
        }

        const config = { fps: 10, qrbox: 250 };

        // Tenta câmera traseira (mobile). Se falhar, usa frontal.
        const startScanner = async (constraints) => {
            await qrInstance.start(
                constraints,
                config,
                async (decodedText) => {
                    // "3 3333" ou com quebra de linha — tratamos ambos
                    const partes = decodedText.trim().split(/\s+/);
                    const usuario = partes[0] || "";
                    const senha = partes[1] || "";

                    const form = getLoginForm();
                    if (!form) return;

                    const userInput = form.querySelector('input[name="usuario"]');
                    const senhaInput = form.querySelector('input[name="senha"]');

                    if (userInput) userInput.value = usuario;
                    if (senhaInput) senhaInput.value = senha;

                    // Para o scanner, esconde e envia o form
                    try { await qrInstance.stop(); } catch (e) { }
                    container.style.display = 'none';
                    form.submit();
                },
                (errorMsg) => {
                    // erros de varredura são normais; silenciar para não poluir console
                }
            );
        };

        try {
            await startScanner({ facingMode: "environment" });
        } catch (e) {
            await startScanner({ facingMode: "user" }); // fallback p/ notebooks
        }
    });

    // Botão cancelar fecha a câmera
    document.getElementById('fechar-qr').addEventListener('click', async () => {
        const container = document.getElementById('qr-container');
        try { if (qrInstance) await qrInstance.stop(); } catch (e) { }
        container.style.display = 'none';
    });
</script>

</script>
{% endblock %}
